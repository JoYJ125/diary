<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan-Do-See 다이어리</title>
    <!-- Supabase JS SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- CSS 스타일 직접 정의 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #111827;
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 30px;
            margin-bottom: 12px;
            color: #374151;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
        }

        /* 폼 스타일 */
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .todo-form input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .todo-form input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .todo-form input[type="date"],
        .todo-form select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: #fff;
        }

        .btn-add {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
        }

        /* 리스트 스타일 */
        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .todo-item:hover {
            border-color: #cbd5e1;
        }

        .todo-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .todo-content input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .todo-title {
            font-size: 0.98rem;
            font-weight: 500;
        }

        .todo-title.completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .todo-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            background-color: #f3f4f6;
            color: #6b7280;
            border-radius: 4px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .btn-delete:hover {
            background-color: #fef2f2;
        }

        /* 요약 카드 스타일 */
        .summary-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
            color: #475569;
        }

        .summary-box span {
            font-weight: bold;
            color: #1e293b;
        }

        .empty-msg {
            color: #9ca3af;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plan-Do-See 다이어리</h1>

        <!-- 1. 할 일 입력 폼 (Plan) -->
        <form id="todoForm" class="todo-form">
            <input type="text" id="todoTitle" placeholder="새로운 할 일을 입력하세요" required>
            <input type="date" id="dueDate" required>
            <select id="priority">
                <option value="HIGH">높음</option>
                <option value="MEDIUM" selected>보통</option>
                <option value="LOW">낮음</option>
            </select>
            <button type="submit" class="btn-add">추가</button>
        </form>

        <!-- 2. 할 일 목록 (Do) -->
        <h2>할 일 목록</h2>
        <ul id="todoList" class="todo-list">
            <li class="empty-msg">로딩 중...</li>
        </ul>

        <!-- 3. 돌아보기 요약 (See) -->
        <h2>돌아보기 (Summary)</h2>
        <div id="summaryBox" class="summary-box">
            <div>전체 할 일: <span id="totalPlans">0</span>개</div>
            <div>완료된 할 일: <span id="completedCount">0</span>개</div>
        </div>
    </div>

    <script>
    (() => {
        // ==========================================
        // 1. Supabase 접속 설정
        // ==========================================
        const SUPABASE_URL = "https://btnbitunvdimfkpylail.supabase.co";
        // ★ Supabase 대시보드 -> Project Settings -> API 에서 'anon / public' 키를 복사해서 넣어주세요!
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0bmJpdHVudmRpbWZrcHlsYWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Mzc4ODQsImV4cCI6MjEwNTExMzg4NH0.3W4nDt7dKtsBDIi212sd4uMZKnLVy0SJgZ_KHKImZT4";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // 2. 할 일 목록 불러오기 (Read)
        // ==========================================
        async function fetchTodos() {
            const { data: todos, error } = await supabase
                .from('todos')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("데이터 불러오기 실패:", error.message);
                return;
            }

            const listEl = document.getElementById('todoList');
            listEl.innerHTML = '';

            if (!todos || todos.length === 0) {
                listEl.innerHTML = '<li class="empty-msg">등록된 할 일이 없습니다.</li>';
                updateSummary(0, 0);
                return;
            }

            let completed = 0;
            todos.forEach(todo => {
                if (todo.status === 'COMPLETED') completed++;

                const li = document.createElement('li');
                li.className = "todo-item";
                li.innerHTML = `
                    <div class="todo-content">
                        <input type="checkbox" ${todo.status === 'COMPLETED' ? 'checked' : ''} 
                               onchange="toggleStatus(${todo.id}, '${todo.status}')">
                        <span class="todo-title ${todo.status === 'COMPLETED' ? 'completed' : ''}">
                            ${todo.title}
                        </span>
                        <span class="todo-badge">기한: ${todo.due_date || '없음'}</span>
                    </div>
                    <button onclick="deleteTodo(${todo.id})" class="btn-delete">삭제</button>
                `;
                listEl.appendChild(li);
            });

            updateSummary(todos.length, completed);
        }

        // ==========================================
        // 3. 할 일 추가하기 (Create)
        // ==========================================
        document.getElementById('todoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('todoTitle').value;
            const dueDate = document.getElementById('dueDate').value;
            const priority = document.getElementById('priority').value;

            const { error } = await supabase
                .from('todos')
                .insert([{
                    title: title,
                    due_date: dueDate,
                    priority: priority,
                    status: 'PENDING'
                }]);

            if (error) {
                alert("추가 실패: " + error.message);
            } else {
                document.getElementById('todoTitle').value = '';
                fetchTodos();
            }
        });

        // ==========================================
        // 4. 할 일 상태 변경 (Update)
        // ==========================================
        async function toggleStatus(id, currentStatus) {
            const nextStatus = currentStatus === 'COMPLETED' ? 'PENDING' : 'COMPLETED';

            const { error } = await supabase
                .from('todos')
                .update({ status: nextStatus, updated_at: new Date() })
                .eq('id', id);

            if (error) {
                alert("상태 변경 실패: " + error.message);
            } else {
                fetchTodos();
            }
        }

        // ==========================================
        // 5. 할 일 삭제하기 (Delete)
        // ==========================================
        async function deleteTodo(id) {
            if (!confirm("정말 삭제하시겠습니까?")) return;

            const { error } = await supabase
                .from('todos')
                .delete()
                .eq('id', id);

            if (error) {
                alert("삭제 실패: " + error.message);
            } else {
                fetchTodos();
            }
        }

        // 요약 화면 업데이트
        function updateSummary(total, completed) {
            document.getElementById('totalPlans').innerText = total;
            document.getElementById('completedCount').innerText = completed;
        }

        // 페이지 로드 시 실행
        fetchTodos();
    })();
    </script>
</body>
</html>
